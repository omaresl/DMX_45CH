<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DMX_45CH visual-ACK blink demo (1 s, LEDs only)</title>
<style>
  body { font-family: monospace; background: #111; color: #ddd; max-width: 900px; margin: 2em auto; }
  #strip { display: flex; gap: 4px; margin: 1em 0; }
  .px { width: 44px; height: 44px; background: #222; border: 1px solid #444; border-radius: 4px; }
  button { font-family: monospace; margin: 2px; padding: 6px 10px; cursor: pointer; }
  #log { background: #000; border: 1px solid #444; height: 220px; overflow-y: auto; padding: 8px; }
  #log div { white-space: pre-wrap; }
  label { font-size: 12px; }
</style>
</head>
<body>
<h2>DMX_45CH visual-ACK blink demo</h2>
<p>Models <code>app_CmdBlink</code> (1 s non-blocking override) + <code>app_CMD</code> triggers.
LEDs only; <code>DMX_Channels</code> untouched.</p>
<div id="strip"></div>
<div>
  <button data-cmd="GET_INFO">GET_INFO (cyan)</button>
  <button data-cmd="DISCOVER">DISCOVER (magenta)</button>
  <button data-cmd="SELECT">SELECT (green, match only)</button>
  <button data-cmd="DESELECT">DESELECT (blue)</button>
  <label><input type="checkbox" id="mismatch"> SELECT UID mismatch (no blink)</label>
</div>
<div id="log"></div>
<script>
"use strict";
const BLINK_MS = 1000, SLOTS = 16, SLOT_MS = 5;
const COLORS = { GET_INFO: [0,255,255], DISCOVER: [255,0,255],
                 SELECT: [0,255,0], DESELECT: [0,0,255] };
const strip = document.getElementById("strip"), log = document.getElementById("log");
const pixels = [];
for (let i = 0; i < 15; i++) {
  const d = document.createElement("div");
  d.className = "px"; strip.appendChild(d); pixels.push(d);
}
let expiry = 0, timer = null;
function stamp() { return (performance.now() / 1000).toFixed(2) + "s"; }
function say(m) {
  const d = document.createElement("div");
  d.textContent = stamp() + "  " + m; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function paint(c) {
  pixels.forEach(p => p.style.background = c ? `rgb(${c[0]},${c[1]},${c[2]})` : "#222");
}
function tick() {
  if (Date.now() >= expiry) { paint(null); timer = null; say("blink expired -> DMX data"); return; }
  timer = setTimeout(tick, 50);
}
function blink(name, color) {
  expiry = Date.now() + BLINK_MS;
  paint(color);
  say(name + " accepted -> RGB(" + color + ") 1 s");
  if (!timer) timer = setTimeout(tick, 50);
}
document.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  const cmd = b.dataset.cmd;
  if (cmd === "DISCOVER") {
    const slot = Math.floor(Math.random() * SLOTS);
    say("DISCOVER accepted -> slot " + slot + " (wait " + (slot * SLOT_MS) + " ms)");
    blink("DISCOVER", COLORS.DISCOVER);
    setTimeout(() => say("TX GET_INFO response in slot " + slot), slot * SLOT_MS);
  } else if (cmd === "SELECT") {
    if (document.getElementById("mismatch").checked) {
      say("SELECT mismatch -> flag cleared silently, no blink (by design)");
    } else {
      blink("SELECT", COLORS.SELECT);
      say("TX ACK (0xA5 0x00)");
    }
  } else if (cmd === "DESELECT") {
    blink("DESELECT", COLORS.DESELECT);
  } else { // GET_INFO
    blink("GET_INFO", COLORS.GET_INFO);
    say("TX GET_INFO response (18 B)");
  }
}));
say("ready: press a command button. Invalid frames never blink.");
</script>
</body>
</html>
